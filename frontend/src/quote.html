  <section class="quote-wrapper">
    <div class="quote-container">
        <h2>Get Your Free Solar Quote</h2>
        <p class="subtitle">Provide your details to get a customized estimate.</p>
        <form id="quoteForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="9876543210" required>
            </div>

            <div class="input-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" placeholder="City / State" required>
            </div>

            <div class="input-group">
                <label for="usage">Monthly Electricity Usage (kWh)</label>
                <input type="number" id="usage" name="usage" placeholder="e.g. 350" required>
            </div>

            <button type="submit" class="quote-form-btn">Submit Quote Request</button>
        </form>
    </div>
  </section>
    <script src="../script/quote.js"></script>
        

</body>
